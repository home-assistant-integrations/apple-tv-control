name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at midnight UTC to catch breaking Home Assistant changes
    - cron: '0 0 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Ruff linting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --select E,F,W --ignore E501
          src: custom_components/

      - name: Check manifest
        run: |
          python3 -c "
          import json
          with open('custom_components/apple_tv_control/manifest.json') as f:
              manifest = json.load(f)
          required = ['name', 'version', 'domain', 'codeowners']
          for key in required:
              assert key in manifest, f'Missing required key: {key}'
          print('Manifest validation passed')
          "
