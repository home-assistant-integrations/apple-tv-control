navigate:
  name: Navigate
  description: Send a directional navigation command to the Apple TV.
  target:
    entity:
      integration: apple_tv_control
      domain: media_player
  fields:
    direction:
      name: Direction
      description: Direction to navigate.
      required: true
      selector:
        select:
          options:
            - label: "Up"
              value: "up"
            - label: "Down"
              value: "down"
            - label: "Left"
              value: "left"
            - label: "Right"
              value: "right"

select:
  name: Select
  description: Send the select command to the Apple TV.
  target:
    entity:
      integration: apple_tv_control
      domain: media_player

back:
  name: Back
  description: Send the back (menu) command to the Apple TV.
  target:
    entity:
      integration: apple_tv_control
      domain: media_player
