<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .box { rx: 8; ry: 8; }
      .node { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
      .success { fill: #d4edda; stroke: #28a745; stroke-width: 2; }
      .error { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; }
      .label { font-size: 13px; fill: #333; font-weight: 600; text-anchor: middle; }
      .sublabel { font-size: 11px; fill: #666; text-anchor: middle; }
      .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-size: 10px; fill: #888; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <!-- Config Entry -->
  <rect x="250" y="20" width="200" height="50" class="box node"/>
  <text x="350" y="51" class="label">Config Entry</text>
  <line x1="350" y1="70" x2="350" y2="110" class="arrow"/>
  <text x="370" y="95" class="arrow-label">Initialize</text>

  <!-- Scan -->
  <rect x="250" y="110" width="200" height="50" class="box node"/>
  <text x="350" y="141" class="label">Scan (discovery)</text>
  <line x1="350" y1="160" x2="350" y2="200" class="arrow"/>
  <text x="370" y="185" class="arrow-label">pyatv.scan()</text>

  <!-- Pair -->
  <rect x="250" y="200" width="200" height="50" class="box node"/>
  <text x="350" y="231" class="label">Pair (if needed)</text>
  <line x1="350" y1="250" x2="350" y2="290" class="arrow"/>
  <text x="370" y="275" class="arrow-label">pyatv.pair()</text>

  <!-- Connect -->
  <rect x="250" y="290" width="200" height="50" class="box node"/>
  <text x="350" y="321" class="label">Connect</text>
  <line x1="350" y1="340" x2="350" y2="370" class="arrow"/>
  <text x="370" y="355" class="arrow-label">pyatv.connect()</text>

  <!-- Ready (success state) -->
  <rect x="250" y="370" width="200" height="50" class="box success"/>
  <text x="350" y="401" class="label">Ready (serving)</text>

  <!-- Disconnect (error state) - side branch -->
  <line x1="450" y1="395" x2="550" y2="395" class="arrow"/>
  <text x="500" y="385" class="arrow-label">On error</text>
  <rect x="550" y="370" width="130" height="50" class="box error"/>
  <text x="615" y="401" class="label">Disconnect</text>
</svg>
